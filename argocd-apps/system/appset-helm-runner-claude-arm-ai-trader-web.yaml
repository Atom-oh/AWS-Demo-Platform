apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-runner-claude-arm-ai-trader-web
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            cluster-name: mall-apne2-mgmt
  template:
    metadata:
      name: 'runner-claude-arm-ai-trader-web-{{name}}'
    spec:
      project: default
      source:
        chart: gha-runner-scale-set
        repoURL: ghcr.io/actions/actions-runner-controller-charts
        targetRevision: 0.10.1
        helm:
          valuesObject:
            githubConfigUrl: https://github.com/Atom-oh/ai-trader-web
            githubConfigSecret: github-app-secret
            controllerServiceAccount:
              name: arc-controller-mall-apne2-mgmt-gha-rs-controller
              namespace: actions-runner-system
            runnerScaleSetName: ai-trader-web-claude-arm
            minRunners: 0
            maxRunners: 50
            listenerTemplate:
              spec:
                containers:
                  - name: listener
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        cpu: 200m
                        memory: 256Mi
                tolerations:
                  - key: workload-type
                    value: platform
                    effect: NoSchedule
                nodeSelector:
                  node-pool: platform
            template:
              metadata:
                annotations:
                  karpenter.sh/do-not-disrupt: "true"
              spec:
                serviceAccountName: claude-runner
                nodeSelector:
                  kubernetes.io/arch: arm64
                containers:
                  - name: runner
                    # CLI 2.1.240; retention/upgrade procedure: docs/runbooks/ai-trader-review-runner.md.
                    image: 180294183052.dkr.ecr.ap-northeast-2.amazonaws.com/actions-runner-claude:cli-2.1.240@sha256:cc315b2a639f1ad215a9907ee92128cadb586bf5390f32a84bcc82db81a7808a
                    imagePullPolicy: IfNotPresent
                    command: ["/home/runner/run.sh"]
                    env:
                      # Claude CLI self-update only; preserve all review/version checks.
                      - name: DISABLE_AUTOUPDATER
                        value: "1"
                      # PR-review panel AI CLI auth (ExternalSecret ai-panel-keys <- /demo-platform/actions/AI-key).
                      # optional: true — a missing key/Secret does not block runner fleet startup (that panel just gracefully skips).
                      - name: KIRO_API_KEY
                        valueFrom:
                          secretKeyRef:
                            name: ai-panel-keys
                            key: KIRO_API_KEY
                            optional: true
                    resources:
                      requests:
                        cpu: "1800m"
                        memory: "3500Mi"
                tolerations:
                  - key: workload-type
                    value: ci-runner
                    effect: NoSchedule
      destination:
        server: '{{server}}'
        namespace: actions-runner-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
