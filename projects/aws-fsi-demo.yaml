name: aws-fsi-demo
github:
  repo: Atom-oh/aws-fsi-demo
  branch: main
description: 금융 문서 OCR·개인정보 마스킹·AgentCore 분석·결과 재조합을 보여주는 EKS 기반 FSI 데모
account: atomoh-main
management: external
display:
  category: showcase
briefing: |
  합성 금융 문서로 OCR → 개인정보 탐지·마스킹 → AI 분석 → 결과 재조합 흐름을 시연합니다.
  fsi-demo-cluster의 서비스와 GPU 워크로드는 aws-fsi-demo 저장소의 전용 ArgoCD 및 운영 절차가 관리합니다.
  이 플랫폼에서는 프로젝트 정보와 데모 링크를 조회합니다. 켜기·끄기·스케일은 FSI의 기존 운영 절차를 사용하세요.
  리소스 목록은 현재 스키마로 표현할 수 있는 DynamoDB 메타데이터이며, 전체 EKS/AgentCore 구성은 연결된 저장소에서 확인할 수 있습니다.
  실제 고객 문서가 아닌 승인된 합성 샘플만 사용하세요.
resources:
  # Metadata only: table contents are not read or managed by this registration.
  - type: dynamodb
    table_names:
      - fsi-demo-pii-mappings
      - fsi-demo-connections
      - fsi-demo-qwen-cache
    always_on: true
urls:
  demo: https://fsi-demo.atomai.click
