name: call-center-admin
github:
  repo: Atom-oh/call-center-admin
  branch: main
description: 카카오페이 콜센터 STT 자동 분류 시스템 (Bedrock Opus 4.7 + Sonnet 4.6 cross-verify, SFN Express, DynamoDB, S3 Parquet, Streamlit HITL)
account: atomoh-main
display:
  category: showcase

# Atlantis flow — the repo's atlantis.yaml holds the project list/directory mapping.
# Only the dev environment is applied in Phase 1. stg/prd are planned for registration after PR10.

resources:
  # Activate after PR7 (analytics) merges — Glue + Athena + Firehose build the analytics data flow.
  # Phase 1's core processing flow is SFN Express + 4 Lambdas (pii_guard/classify/verify/persist).
  # The always_on flag is purely for dashboard display — the actual toggle is undecided until Phase 3 (HITL UI / Streamlit).

  # Step Functions Express state machine — always active (near-zero cost when idle)
  - type: stepfunctions
    state_machine_name: callcenter-dev-classify
    always_on: true

  # 4 Lambdas — billed per invocation
  - type: lambda
    function_names:
      - callcenter-dev-pii-guard
      - callcenter-dev-classify
      - callcenter-dev-verify
      - callcenter-dev-persist
    always_on: true

  # DynamoDB consult-results — operational data, on-demand billing
  - type: dynamodb
    table_names:
      - callcenter-dev-consult-results
    always_on: true

  # Firehose Parquet (PR7) — analytics data
  - type: firehose
    delivery_stream_names:
      - callcenter-dev-consult-fh
    always_on: true

urls:
  spec: https://github.com/Atom-oh/call-center-admin/blob/main/docs/superpowers/specs/2026-05-22-callcenter-stt-classification-design.md
  architecture: https://github.com/Atom-oh/call-center-admin/blob/main/docs/architecture.md
