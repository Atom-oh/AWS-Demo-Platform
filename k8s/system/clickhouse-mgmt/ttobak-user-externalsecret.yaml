# Password for the credentialed `ttobak` OTel writer. The same Secrets Manager
# secret is read by ttobak's own collector (TtobakObservabilityStack).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-ttobak
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: clickhouse-ttobak
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: /demo-platform/clickhouse/ttobak
        property: password
