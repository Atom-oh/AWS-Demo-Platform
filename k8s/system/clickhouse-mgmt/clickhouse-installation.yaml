apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: clickhouse
  namespace: observability
spec:
  defaults:
    templates:
      dataVolumeClaimTemplate: data-volume
      serviceTemplate: svc-template
  configuration:
    clusters:
      - name: otel
        layout:
          shardsCount: 1
          replicasCount: 1
        templates:
          podTemplate: clickhouse-pod
    users:
      # default user has no password (otel-collector exporters connect unauthenticated).
      # Restrict the user-level network ACL to the hub/spoke RFC1918 range to match the
      # internal NLB's loadBalancerSourceRanges (defense in depth). Residual risk that any
      # 10.0.0.0/8 host reaches the unauthenticated DB is accepted/documented in ADR-007.
      default/networks/ip:
        - "10.0.0.0/8"
      default/profile: default
      default/quota: default
      # Credentialed writer for ttobak's collector (via the ClickHouse
      # PrivateLink). Limited to the otel database; password from ESO.
      ttobak/k8s_secret_password: observability/clickhouse-ttobak/password
      ttobak/networks/ip:
        - "10.0.0.0/8"
      ttobak/profile: default
      ttobak/quota: default
      # Explicit grants replace the broad implicit users.xml privileges (e.g.
      # SYSTEM SHUTDOWN on *.*) and restrict the user to otel. ClickHouse rejects
      # `grants` combined with allow_databases, so the allow-list is removed.
      # The exporter's create_schema needs CREATE on otel.
      ttobak/grants/query:
        - "GRANT SELECT, INSERT, ALTER, CREATE DATABASE, CREATE TABLE, CREATE VIEW ON otel.*"
    profiles:
      default/max_memory_usage: "8000000000"
      default/max_query_size: "1073741824"
    settings:
      format_schema_path: /etc/clickhouse-server/config.d/
    files:
      # ClickHouse's own system log tables have no retention by default; on
      # 2026-11-06 they held ~60 GB and filled the volume (all inserts failed).
      # Keep 7 days of each. Loaded from config.d. query_log, part_log and
      # trace_log are omitted: the operator defines their engine (with a 30-day
      # TTL), and ClickHouse rejects a separate <ttl> for such tables (code 36).
      system_log_ttl.xml: |
        <clickhouse>
          <query_views_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_views_log>
          <text_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></text_log>
          <metric_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></metric_log>
          <asynchronous_metric_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></asynchronous_metric_log>
          <processors_profile_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></processors_profile_log>
          <asynchronous_insert_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></asynchronous_insert_log>
          <error_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></error_log>
        </clickhouse>
      init_otel_schema.sql: |
        CREATE DATABASE IF NOT EXISTS otel;

        CREATE TABLE IF NOT EXISTS otel.otel_traces (
            Timestamp DateTime64(9) CODEC(Delta, ZSTD(1)),
            TraceId String CODEC(ZSTD(1)),
            SpanId String CODEC(ZSTD(1)),
            ParentSpanId String CODEC(ZSTD(1)),
            TraceState String CODEC(ZSTD(1)),
            SpanName LowCardinality(String) CODEC(ZSTD(1)),
            SpanKind LowCardinality(String) CODEC(ZSTD(1)),
            ServiceName LowCardinality(String) CODEC(ZSTD(1)),
            ResourceAttributes Map(LowCardinality(String), String) CODEC(ZSTD(1)),
            ScopeName String CODEC(ZSTD(1)),
            ScopeVersion String CODEC(ZSTD(1)),
            SpanAttributes Map(LowCardinality(String), String) CODEC(ZSTD(1)),
            Duration Int64 CODEC(ZSTD(1)),
            StatusCode LowCardinality(String) CODEC(ZSTD(1)),
            StatusMessage String CODEC(ZSTD(1)),
            Events Nested (
                Timestamp DateTime64(9),
                Name LowCardinality(String),
                Attributes Map(LowCardinality(String), String)
            ) CODEC(ZSTD(1)),
            Links Nested (
                TraceId String,
                SpanId String,
                TraceState String,
                Attributes Map(LowCardinality(String), String)
            ) CODEC(ZSTD(1))
        ) ENGINE = MergeTree()
        PARTITION BY toDate(Timestamp)
        ORDER BY (ServiceName, SpanName, toUnixTimestamp(Timestamp), TraceId)
        TTL toDateTime(Timestamp) + INTERVAL 30 DAY DELETE
        SETTINGS index_granularity = 8192, ttl_only_drop_parts = 1;

        CREATE TABLE IF NOT EXISTS otel.otel_logs (
            Timestamp DateTime64(9) CODEC(Delta, ZSTD(1)),
            TraceId String CODEC(ZSTD(1)),
            SpanId String CODEC(ZSTD(1)),
            TraceFlags UInt32 CODEC(ZSTD(1)),
            SeverityText LowCardinality(String) CODEC(ZSTD(1)),
            SeverityNumber Int32 CODEC(ZSTD(1)),
            ServiceName LowCardinality(String) CODEC(ZSTD(1)),
            Body String CODEC(ZSTD(1)),
            ResourceAttributes Map(LowCardinality(String), String) CODEC(ZSTD(1)),
            ScopeName String CODEC(ZSTD(1)),
            ScopeVersion String CODEC(ZSTD(1)),
            LogAttributes Map(LowCardinality(String), String) CODEC(ZSTD(1))
        ) ENGINE = MergeTree()
        PARTITION BY toDate(Timestamp)
        ORDER BY (ServiceName, SeverityText, toUnixTimestamp(Timestamp), TraceId)
        TTL toDateTime(Timestamp) + INTERVAL 30 DAY DELETE
        SETTINGS index_granularity = 8192, ttl_only_drop_parts = 1;
  templates:
    podTemplates:
      - name: clickhouse-pod
        spec:
          tolerations:
            - key: workload-type
              value: platform
              effect: NoSchedule
          nodeSelector:
            node-pool: platform
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:24.8
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
              ports:
                - name: http
                  containerPort: 8123
                - name: tcp
                  containerPort: 9000
                - name: interserver
                  containerPort: 9009
    volumeClaimTemplates:
      - name: data-volume
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              # Expanded online on 2026-11-06 (gp3, allowVolumeExpansion) after
              # the 100Gi volume filled; PVCs cannot shrink.
              storage: 200Gi
    serviceTemplates:
      - name: svc-template
        generateName: clickhouse-{chi}
        spec:
          ports:
            - name: http
              port: 8123
            - name: tcp
              port: 9000
          type: ClusterIP
