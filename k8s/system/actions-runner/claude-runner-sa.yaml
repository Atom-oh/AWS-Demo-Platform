# ServiceAccount shared by all claude-arm runner scale sets.
# Receives AWS credentials via an EKS Pod Identity Association (claude-runner -> mall-apne2-mgmt-ci-runner).
# Using this instead of a per-scaleset `<name>-gha-rs-no-permission` SA means a new
# Pod Identity Association doesn't need to be created every time a runner is added (one shared one is enough).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-runner
  namespace: actions-runner-system
