# AI CLI auth key for the PR review panel.
# Secrets Manager `/demo-platform/actions/AI-key` (JSON: KIRO_API_KEY)
#   -> K8s Secret `ai-panel-keys` -> runner container env (appset).
# Codex is Bedrock-native, so no key is needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-panel-keys
  namespace: actions-runner-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-panel-keys
    creationPolicy: Owner
  data:
    - secretKey: KIRO_API_KEY
      remoteRef: { key: /demo-platform/actions/AI-key, property: KIRO_API_KEY }
