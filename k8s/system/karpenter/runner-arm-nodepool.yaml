apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: runner-arm
spec:
  template:
    metadata:
      labels:
        node-pool: runner-arm
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: runner-arm
      requirements:
        # on-demand only: PR-review CI jobs run 20-30min of wall-clock, and this pool had no
        # SQS-based Karpenter interruption-queue configured — a spot reclaim mid-job just kills
        # the runner pod outright ("runner has received a shutdown signal", exit 130), no graceful
        # drain. 46 nodeclaims were garbage_collected (instance gone before Karpenter's own
        # disruption flow ever ran) out of ~1644 lifetime terminations on this nodepool —
        # consistent with spot interruption. Runner pod CPU/memory usage measured well under
        # request throughout (verified via Prometheus + kubectl top during a live panel run), so
        # this was never a sizing problem — it is spot-eviction risk on a long-running CI job.
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: kubernetes.io/arch
          operator: In
          values:
            - arm64
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            - c6g
            - c7g
            - m6g
            - m7g
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values:
            - xlarge
            - 2xlarge
            - 4xlarge
      taints:
        - key: workload-type
          value: ci-runner
          effect: NoSchedule
  limits:
    cpu: "128"
    memory: 256Gi
  disruption:
    consolidationPolicy: WhenEmpty
    # 30s → 5m (ADR-015): pr-review.yml 이 단일 job 에서 panel(모델별 5개 병렬 job)+chair
    # job 으로 쪼개지면서, panel 5파드가 끝난 뒤 chair 파드가 뒤이어 같은 노드에 뜬다.
    # 30s 는 chair 가 스케줄되기 전에 노드가 이미 consolidate 돼(WhenEmpty) 매번 새 노드
    # 콜드스타트를 유발했다 — 5m 으로 늘려 chair 가 panel 이 쓰던 노드를 재사용하게 한다.
    consolidateAfter: 5m
