name: Build Runner Image
# Builds the actions-runner-claude image and pushes it to ECR (native ARM64, OIDC -> ECR,
# ADR-003 pattern). Weekly rebuild keeps base image/CLIs/plugins current.

on:
  workflow_dispatch:
  schedule:
    # Sat 18:00 UTC = Sun 03:00 KST. Best-effort: push only runs after a successful
    # build, so a broken install leaves the live :latest untouched.
    - cron: "0 18 * * 6"

jobs:
  build:
    runs-on: aws-demo-platform-arm
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REGISTRY: 180294183052.dkr.ecr.ap-northeast-2.amazonaws.com
      REPO: actions-runner-claude
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::180294183052:role/demo-platform-gha-ecr-push
          aws-region: ap-northeast-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push (native ARM64)
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::12}" # matches ECR lifecycle tagPrefix 'sha'
          docker build --pull --platform=linux/arm64 \
            -t "$ECR_REGISTRY/$REPO:latest" \
            -t "$ECR_REGISTRY/$REPO:$TAG" \
            docker/actions-runner-claude
          docker push "$ECR_REGISTRY/$REPO:latest"
          docker push "$ECR_REGISTRY/$REPO:$TAG"
