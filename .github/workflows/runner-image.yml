name: Build Runner Image
# Builds the actions-runner-claude image (official ARC runner ghcr.io/actions/actions-runner base
# + gh/aws/node + claude-code + baked Codex/code-review/github plugins + codex/kiro-cli) in this
# repo and pushes it to ECR. Native ARM64 build (no emulation), OIDC -> ECR (ADR-003 pattern).
# NOTE: FROM is the upstream official image, not this workflow's own output (:latest)
#   -> no recursive stacking on weekly builds. The runner agent/OS/.NET are delegated to upstream.

on:
  # Manual trigger.
  workflow_dispatch:
  # Weekly rebuild — keeps the base image/CLIs/plugins current.
  # best-effort: `docker push` only runs after a successful build, so if install/verification
  # breaks, the build step fails and push is never reached -> the live `:latest` in ECR is left
  # untouched and running runners are unaffected. The cron only fires on the default branch
  # (main).
  schedule:
    - cron: "0 18 * * 6"   # Sat 18:00 UTC = Sun 03:00 KST

jobs:
  build:
    runs-on: aws-demo-platform-arm
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REGISTRY: 180294183052.dkr.ecr.ap-northeast-2.amazonaws.com
      REPO: actions-runner-claude
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::180294183052:role/demo-platform-gha-ecr-push
          aws-region: ap-northeast-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push (native ARM64)
        run: |
          set -euo pipefail
          # Tag follows the `sha-<sha>` convention (same as backend-ci, matches the ECR
          # lifecycle tagPrefix 'sha').
          TAG="sha-${GITHUB_SHA::12}"
          docker build --pull --platform=linux/arm64 \
            -t "$ECR_REGISTRY/$REPO:latest" \
            -t "$ECR_REGISTRY/$REPO:$TAG" \
            docker/actions-runner-claude
          docker push "$ECR_REGISTRY/$REPO:latest"
          docker push "$ECR_REGISTRY/$REPO:$TAG"
