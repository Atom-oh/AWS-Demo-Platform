name: AI Code Review

# Lens×model matrix panel review for every PR: Codex + Kiro x2 + Claude self-review, each
# across lenses L2-L5 (4 models x 4 lenses = 16 cells), run as 4 parallel per-model `panel`
# jobs; a `chair` job aggregates the artifacts and posts a synthesized, fail-closed
# VERDICT comment. Direct CLI invocation (not marketplace actions) — see ADR-016/011/
# 013/014/015 for design history.

on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main] # only main->dev, tag->prod — no non-main PRs

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Must stay us-east-1: codex (openai.gpt-5.6-sol/bedrock-mantle) is In-Region only, and
  # claude-fable-5 needs the on-demand US geo inference profile — both endpoint and
  # AWS_REGION must match or SigV4 signing fails.
  ANTHROPIC_MODEL: us.anthropic.claude-fable-5
  CLAUDE_CODE_USE_BEDROCK: 1
  ANTHROPIC_BEDROCK_BASE_URL: https://bedrock-runtime.us-east-1.amazonaws.com
  AWS_REGION: us-east-1

jobs:
  panel:
    name: "AI Panel (${{ matrix.model }})"
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: aws-demo-platform-claude-arm
    # Ceiling is PANEL_TIMEOUT x PANEL_RETRIES (300x3=15min, claude-self 480x2=16min) +
    # node boot; 20min backstops a hang.
    timeout-minutes: 20
    permissions:
      # No write: even if a cell is prompt-injected into leaking credentials, this
      # GITHUB_TOKEN can't touch PR comments/content. Only the chair job upserts.
      pull-requests: read
      contents: read
    strategy:
      fail-fast: false # one vendor failing shouldn't stop the others; chair's coverage floor judges the gaps
      matrix:
        model: [codex, kiro-fable, kiro-sol, claude-self]
    steps:
      # pull_request_target runs with secrets/write perms, so we check out base (trusted)
      # rather than PR head — PR head code could rewrite scripts/*.sh and steal panel
      # keys/node IAM. The PR's changes reach us only as diff data via prepare-inputs.sh's
      # `gh api compare` (never executed). persist-credentials: false so GH_TOKEN isn't
      # left in .git/config for exfiltration by even a hypothetically tool-enabled cell
      # (defense-in-depth — Kiro's --trust-tools= guard already denies it tool access).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify panel CLI present (pre-installed on runner)
        run: |
          # Missing CLI is non-blocking: run-panel.sh leaves that cell empty and
          # aggregate.sh's degraded floor catches it.
          for c in codex kiro-cli claude; do
            command -v "$c" >/dev/null 2>&1 || echo "::warning::$c not found on runner (image needs rebuild)"
          done

      - name: Prepare diff + lens prompts (SHA-pinned, same inputs across all panel/chair jobs)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/pr-review/prepare-inputs.sh \
            "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.base.sha }}" \
            /tmp/pr-review

      - name: "Run panel cell (model: ${{ matrix.model }}, all lenses)"
        env:
          # claude-self does extra read-only tool calls (gh/github MCP/Read/Grep/Glob)
          # on top of the diff, so it needs more headroom than the other panelists,
          # which only process the diff text — PR #92 saw it hit 300s on all 4 lenses
          # on a large (65-file) diff. 480x2=960s stays under the 20min job timeout.
          PANEL_TIMEOUT: ${{ matrix.model == 'claude-self' && '480' || '300' }}
          PANEL_RETRIES: ${{ matrix.model == 'claude-self' && '2' || '3' }}
          # Only claude-self uses this token (read-only gh/MCP tools); codex/kiro run
          # with no tool access, so we don't expose the token to their process env.
          GH_TOKEN: ${{ matrix.model == 'claude-self' && github.token || '' }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ matrix.model == 'claude-self' && github.token || '' }}
        run: |
          bash scripts/pr-review/run-panel.sh /tmp/pr-review/pr-diff-truncated.txt \
            /tmp/pr-review/lenses /tmp/pr-review "${{ matrix.model }}"

      - name: Scrub + shrink cell outputs before upload
        run: |
          # .err has never been exposed as an artifact before; scrub secrets and
          # tail-truncate in place so raw stack traces aren't published to anyone with
          # repo read access.
          DIR="${GITHUB_WORKSPACE}/scripts/pr-review"; . "$DIR/lib.sh"
          for f in /tmp/pr-review/slot/*.md; do
            [ -f "$f" ] || continue
            scrub_secrets < "$f" > "$f.scrubbed" && mv "$f.scrubbed" "$f"
          done
          for f in /tmp/pr-review/slot/*.err; do
            [ -f "$f" ] || continue
            tail -c 4000 "$f" | scrub_secrets > "$f.scrubbed" && mv "$f.scrubbed" "$f"
          done

      # Upload the $SLOT directory as a single path, not individual files/wildcards —
      # upload-artifact@v4 roots the artifact at the LCA of matched files, which shifts
      # if an optional file (e.g. kiro-diff-truncated.flag) is sometimes absent, breaking
      # aggregate.sh's fixed "$WORK/slot" path (PR#88 CRITICAL).
      - uses: actions/upload-artifact@v4
        with:
          name: pr-review-slot-${{ matrix.model }}
          path: /tmp/pr-review/slot
          if-no-files-found: warn # a total cell wipeout is judged by the chair's coverage floor, not blocked here
          retention-days: 1

  chair:
    name: Chair Synthesis
    needs: panel
    # !cancelled() (not always()): runs the chair on panel failure/timeout so the
    # fail-closed gate still fires, but skips it on cancellation — always() would let a
    # stale chair from a cancelled run race to comment on the new run's SHA (PR#88 MAJOR).
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: aws-demo-platform-claude-arm
    # Ceiling is CHAIR_TIMEOUT x 2 (primary+fallback, 600x2=20min) + node boot.
    timeout-minutes: 25
    permissions:
      pull-requests: write # only this job is granted comment upsert
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Claude Code CLI present (pre-installed on runner)
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            echo "::warning::claude CLI not found on runner, falling back to npm global install"
            npm install -g @anthropic-ai/claude-code
          fi
          claude --version

      - name: Prepare diff (same SHA-pinned inputs as panel jobs)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/pr-review/prepare-inputs.sh \
            "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.base.sha }}" \
            /tmp/pr-review
          echo "panel_truncated=$([ -f /tmp/pr-review/diff-truncated.flag ] && echo 1 || echo 0)" >> "$GITHUB_ENV"

      # Extract into $SLOT itself (matching the single-directory upload) so files land at
      # $SLOT/*.md, not $WORK/*.md (PR#88 CRITICAL). merge-multiple: true merges the 4
      # per-model artifacts (filenames don't collide). continue-on-error: if every panel
      # job failed/was cancelled and no artifacts exist, let this step pass through so
      # aggregate.sh treats a missing $SLOT as all-models-degraded (PR#88 MAJOR) rather
      # than failing before the fail-closed gate is reached.
      - name: Reset slot dir (defense-in-depth against a reused/non-ephemeral runner workspace)
        run: rm -rf /tmp/pr-review/slot && mkdir -p /tmp/pr-review/slot

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: pr-review-slot-*
          merge-multiple: true
          path: /tmp/pr-review/slot

      - name: "Aggregate panel results + synthesize (Claude chair)"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # GH_TOKEN for gh CLI, GITHUB_PERSONAL_ACCESS_TOKEN for the github MCP plugin —
          # both job-scoped (pull-requests: write, contents: read), not a pod-wide PAT.
          GH_TOKEN: ${{ github.token }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/pr-review/aggregate.sh /tmp/pr-review/lenses /tmp/pr-review
          bash scripts/pr-review/synthesize.sh /tmp/pr-review/pr-diff-truncated.txt /tmp/pr-review \
            "$PR_NUMBER" "$PR_TITLE" /tmp/review.md
          echo "panel_responded=$(tr '\n' ' ' < /tmp/pr-review/responded.txt 2>/dev/null)" >> "$GITHUB_ENV"

      - name: Check for blocking issues
        id: gate
        run: |
          # Only the last non-empty line counts, so a quoted "VERDICT: FAIL" elsewhere in
          # the body isn't misdetected. Must match synthesize.sh's chair_valid()
          # normalization exactly, or the two could disagree on the same file.
          last_line="$(awk 'NF{last=$0} END{print last}' /tmp/review.md)"
          # || true: grep -c returns exit 1 on zero matches, which would otherwise abort
          # under set -e before the fail-closed else branch runs.
          verdict_count="$(grep -c '^VERDICT:' /tmp/review.md || true)"
          if [ "$last_line" = "VERDICT: FAIL" ]; then
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "reason=VERDICT: FAIL" >> "$GITHUB_OUTPUT"
          elif [ "$last_line" = "VERDICT: PASS" ] && [ "$verdict_count" = "1" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "reason=No blocking issues" >> "$GITHUB_OUTPUT"
          else
            # fail-closed: if there's no VERDICT line, block safely
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "reason=No VERDICT line found — fail-closed" >> "$GITHUB_OUTPUT"
          fi

      - name: Post review comment (upsert)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GATE_RESULT: ${{ steps.gate.outputs.result }}
        run: |
          MARKER="<!-- aws-demo-platform-pr-review -->"
          if [ "$GATE_RESULT" = "fail" ] && [ "${chair_failed:-0}" = "1" ]; then
            # Chair itself failed (timeout/connection error, not a code issue) — still
            # fail-closed BLOCKED, but worded differently from a real CRITICAL/MAJOR fail.
            STATUS_BADGE="**Status: BLOCKED** — review generation failed (model timeout/error) — not a code issue, re-run the workflow"
          elif [ "$GATE_RESULT" = "fail" ]; then
            STATUS_BADGE="**Status: BLOCKED** — CRITICAL/MAJOR issues must be resolved before merge"
          else
            STATUS_BADGE="**Status: PASSED** — No blocking issues found"
          fi
          # Must use the same last-non-empty-line normalization as the gate step above,
          # or the VERDICT line can end up left in the posted comment.
          last_verdict_ln="$(awk '/^VERDICT:/{ln=NR} END{print ln+0}' /tmp/review.md)"
          if [ "$last_verdict_ln" -gt 0 ]; then
            sed "${last_verdict_ln}d" /tmp/review.md > /tmp/review-clean.md
          else
            cp /tmp/review.md /tmp/review-clean.md
          fi
          {
            echo "$MARKER"
            echo "## 🤖 AI Code Review (${chair_used:-Claude Fable 5} chair · lens×model matrix: Codex + Kiro x3 + Claude self-review, L2-L5)"
            echo ""
            echo "_Cells (model/lens): ${panel_responded:-solo}_"
            [ "${panel_truncated:-0}" = "1" ] && echo "_⚠️ diff truncated to first 3000 lines — review is partial._"
            echo ""
            echo "$STATUS_BADGE"
            echo ""
            cat /tmp/review-clean.md
            echo ""
            echo "---"
            echo "_Triggered by commit \`${{ github.event.pull_request.head.sha }}\` · workflow: \`.github/workflows/pr-review.yml\`_"
          } > /tmp/comment.md
          # If a marker comment already exists, upsert via PATCH; otherwise post new
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- aws-demo-platform-pr-review -->")) | .id' 2>/dev/null | head -1)
          if [ -n "$EXISTING" ]; then
            gh api "repos/$REPO/issues/comments/$EXISTING" -X PATCH -f body="$(cat /tmp/comment.md)" 2>/dev/null || \
              gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          fi

      - name: Fail if CRITICAL or MAJOR
        if: steps.gate.outputs.result == 'fail'
        run: |
          echo "AI Review failed: ${{ steps.gate.outputs.reason }}"
          exit 1
