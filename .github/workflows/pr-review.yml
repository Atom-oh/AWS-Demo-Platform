name: AI Code Review

# PR마다 lens×모델 매트릭스 패널(Codex + Kiro x3 + Claude 셀프리뷰, L2~L5 각 lens 독립
# 에이전트 — 5모델×4lens=20셀)이 리뷰하고 Claude 의장이 lens별로 종합해 코멘트로 게시.
# multi-region-architecture(PR #25)·aws-fsi-demo(PR #425) 의 lens×model 매트릭스 설계를
# 이 repo(Codex + Kiro x3 + Claude 셀프리뷰 5-패널 구성)로 포팅한 뒤(ADR-007/011/013/014),
# 단일 job(20셀 전부 `&`+`wait` 백그라운드)에서 모델별 5개 병렬 job + artifact + chair job
# 으로 재구성(ADR-015) — 이유:
#   - 자원 경합: 러너 요청 cpu=1800m 인데 파드 하나에 LLM CLI 20개가 동시에 뜨던 것을
#     4개(모델당 lens 4개)로 줄임.
#   - 관측성: 모델별 job 이 Actions UI 에 개별 로그/타이밍/재실행으로 보임.
#   - 파드 사망 대비: panel job artifact 가 남아 chair 의 coverage floor 가 결측을 그대로
#     감지 → fail-closed. 기존엔 파드 하나가 죽으면 20셀이 통째로 사라졌다.
#   - 권한 최소화: panel job 은 pull-requests:write 없이 돈다 — 코멘트 upsert 는 chair job 만.
#   - VERDICT: PASS|FAIL 마지막 줄 룰로 job exit code 결정 — 게이트 로직 자체는 불변.
#   - <!-- aws-demo-platform-pr-review --> marker 로 코멘트 upsert (PR 업데이트마다 새 코멘트 안 쌓임)
# 마켓플레이스 액션(kiro-cli-review-action/codex-action/claude-code-action) 조사 결과 전부
# 현 구성 대비 downgrade(리뷰 텍스트 미노출/Bedrock 미지원/래퍼 의존) — CLI 직접 호출 유지.

on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main] # 이 repo의 유일한 PR 타겟(main→dev, tag→prod) — non-main PR은 없음

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # 전부 us-east-1: endpoint/AWS_REGION 일치 → SigV4 서명 리전 불일치 없음.
  # Claude 의장/셀프리뷰: US geo 추론 프로파일 `us.anthropic.claude-fable-5`(non-global,
  #   on-demand 지원 — bare In-Region id 는 on-demand 불가). us-east-1 엔드포인트로
  #   호출(로컬 검증됨). codex(openai.gpt-5.6-sol / bedrock-mantle, In-Region 전용)도
  #   AWS_REGION=us-east-1. 노드 IAM(ci_runner, bedrock Resource=*) SigV4.
  ANTHROPIC_MODEL: us.anthropic.claude-fable-5
  CLAUDE_CODE_USE_BEDROCK: 1
  ANTHROPIC_BEDROCK_BASE_URL: https://bedrock-runtime.us-east-1.amazonaws.com
  AWS_REGION: us-east-1

jobs:
  panel:
    name: "AI Panel (${{ matrix.model }})"
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: aws-demo-platform-claude-arm
    # 행 백스톱: 정상 상한은 PANEL_TIMEOUT×PANEL_RETRIES(300×3=15분) + 노드 부팅이므로
    # 20분이면 정상 실행을 자르지 않고 행만 끊는다.
    timeout-minutes: 20
    permissions:
      # write 없음 — panel 셀이 프롬프트 인젝션에 유도돼 크리덴셜을 뱉어도 이 job 의
      # GITHUB_TOKEN 에는 PR 코멘트/내용 쓰기 권한이 없다. 코멘트 upsert 는 chair job 만.
      pull-requests: read
      contents: read
    strategy:
      fail-fast: false # 한 벤더가 실패해도 나머지 4개 모델 job 은 계속 — chair 의 coverage floor 가 결측을 판정
      matrix:
        model: [codex, kiro-opus, kiro-gpt, kiro-glm, claude-self]
    steps:
      # 보안(M1): pull_request_target 는 시크릿/쓰기권한 컨텍스트다. PR head 코드를
      # 실행하면 push 권한자가 scripts/*.sh 를 바꿔 패널 키/노드 IAM 을 탈취할 수 있다.
      # 따라서 base(머지 대상, 신뢰됨)를 체크아웃해 scripts/* + CLAUDE.md/AGENTS.md 를
      # 신뢰 컨텍스트로 쓰고, PR 변경분은 prepare-inputs.sh 의 `gh api compare` 로
      # '데이터'로만 받는다(미실행). persist-credentials: false — 기본값(true)은
      # GH_TOKEN을 .git/config의 http.<host>.extraheader(AUTHORIZATION: basic <base64>)로
      # 남긴다. Kiro가 base 체크아웃 전체를 read/grep/fs_read 하도록 의도적으로 허용돼
      # 있어(diff 파일 경로를 kiro에게 직접 넘기는 설계), diff 인젝션이 Kiro를 유도해
      # .git/config를 읽고 그 값을 셀 출력에 뱉으면 토큰이 그대로 새어나간다(lib.sh의
      # scrub_secrets가 이 토큰 포맷을 잡는 규칙을 함께 갖고 있지만, 그건
      # last-line-of-defense일 뿐 예방이 아니다). 체크아웃 시점에 자격증명을 아예 남기지
      # 않는 것이 예방 계층 — 이 job 은 애초에 write 토큰이 없어 이중으로 방어된다.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify panel CLI present (pre-installed on runner)
        run: |
          # 패널 CLI 는 이미지에 baking 되어 있어야 한다. 부재 시 graceful skip(비차단,
          # run-panel.sh 가 해당 모델 셀을 빈 슬롯으로 남김 → aggregate.sh 의 degraded
          # floor 가 감지).
          for c in codex kiro-cli claude; do
            command -v "$c" >/dev/null 2>&1 || echo "::warning::$c not found on runner (image needs rebuild)"
          done

      - name: Prepare diff + lens prompts (SHA-pinned, same inputs across all panel/chair jobs)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/pr-review/prepare-inputs.sh \
            "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.base.sha }}" \
            /tmp/pr-review

      - name: "Run panel cell (model: ${{ matrix.model }}, all lenses)"
        env:
          PANEL_TIMEOUT: "300"
          GH_TOKEN: ${{ github.token }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
        run: |
          bash scripts/pr-review/run-panel.sh /tmp/pr-review/pr-diff-truncated.txt \
            /tmp/pr-review/lenses /tmp/pr-review "${{ matrix.model }}"

      - name: Scrub cell outputs before upload
        run: |
          # .err 는 지금까지 파드를 떠난 적이 없다(로그에 찍을 때만 scrub_secrets 를
          # 통과). artifact 로 올리면 저장소 read 권한자 누구나 원문을 내려받을 수 있어
          # — public repo 면 전원 — 새 노출 경로가 생긴다. 업로드 직전 in-place scrub.
          # (synthesize.sh 의 셀 scrub 은 그대로 유지 — idempotent, defense in depth.)
          DIR="$(pwd)/scripts/pr-review"; . "$DIR/lib.sh"
          for f in /tmp/pr-review/slot/*.md /tmp/pr-review/slot/*.err; do
            [ -f "$f" ] || continue
            scrub_secrets < "$f" > "$f.scrubbed" && mv "$f.scrubbed" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: pr-review-slot-${{ matrix.model }}
          path: |
            /tmp/pr-review/slot/*.md
            /tmp/pr-review/slot/*.err
            /tmp/pr-review/kiro-diff-truncated.flag
          if-no-files-found: warn # 셀 전멸도 chair 의 coverage floor 가 판정한다 — 여기선 막지 않음
          retention-days: 7

  chair:
    name: Chair Synthesis
    needs: panel
    # always(): panel job 이 전부 실패/취소돼도 chair 가 돌아 coverage floor 로
    # fail-closed 한다. needs 만 두면(if 없이) matrix 전체 실패 시 chair 가 skip 되고
    # 게이트 자체가 조용히 사라진다.
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: aws-demo-platform-claude-arm
    # 정상 상한은 CHAIR_TIMEOUT×2(primary+fallback, 600×2=20분) + 노드 부팅.
    timeout-minutes: 25
    permissions:
      pull-requests: write # 코멘트 upsert 는 이 job 에만 부여
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Claude Code CLI present (pre-installed on runner)
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            echo "::warning::claude CLI not found on runner, falling back to npm global install"
            npm install -g @anthropic-ai/claude-code
          fi
          claude --version

      - name: Prepare diff (same SHA-pinned inputs as panel jobs)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/pr-review/prepare-inputs.sh \
            "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.base.sha }}" \
            /tmp/pr-review
          echo "panel_truncated=$([ -f /tmp/pr-review/diff-truncated.flag ] && echo 1 || echo 0)" >> "$GITHUB_ENV"

      # 다운로드 경로는 slot/ 이 아니라 그 부모 — 업로드가 /tmp/pr-review 를 공통 조상으로
      # 잡아 slot/*.md·slot/*.err·kiro-diff-truncated.flag(둘 다 아티팩트 안에서 이
      # 상대구조를 유지) 를 그대로 보존하므로, 다운로드도 같은 부모에 풀어야 slot/*.md 가
      # slot/slot/*.md 로 중첩되지 않는다. merge-multiple: true 로 5개 아티팩트가 같은
      # slot/ 아래로 합쳐진다(파일명이 모델별로 겹치지 않으므로 충돌 없음; flag 파일만
      # 여러 kiro artifact 가 동일 이름으로 덮어써도 무해 — 존재 여부만 의미 있음).
      - uses: actions/download-artifact@v4
        with:
          pattern: pr-review-slot-*
          merge-multiple: true
          path: /tmp/pr-review

      - name: "Aggregate panel results + synthesize (Claude chair)"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # Claude 의장이 read-only 로 PR·repo 맥락을 가져올 때 쓰는 토큰.
          # GH_TOKEN: gh CLI 인증. GITHUB_PERSONAL_ACCESS_TOKEN: github 플러그인(MCP) 인증.
          # 둘 다 잡-스코프 토큰(pull-requests: write, contents: read) — pod-wide PAT 아님.
          GH_TOKEN: ${{ github.token }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/pr-review/aggregate.sh /tmp/pr-review/lenses /tmp/pr-review
          bash scripts/pr-review/synthesize.sh /tmp/pr-review/pr-diff-truncated.txt /tmp/pr-review \
            "$PR_NUMBER" "$PR_TITLE" /tmp/review.md
          echo "panel_responded=$(tr '\n' ' ' < /tmp/pr-review/responded.txt 2>/dev/null)" >> "$GITHUB_ENV"

      - name: Check for blocking issues
        id: gate
        run: |
          # 마지막 non-empty 줄만 신뢰 — 본문 어딘가(패널 인용 등)에 "VERDICT: FAIL" 문자열이
          # 나타나도 실제 판정 줄이 아니면 오검출되지 않도록. verdict_count==1 로 중복/부재도 배제.
          # awk 로 trailing 빈 줄을 건너뛴다 — synthesize.sh의 chair_valid() 와
          # 동일한 정규화라야 "chair_valid는 통과, gate는 오차단" 불일치가 생기지 않는다.
          last_line="$(awk 'NF{last=$0} END{print last}' /tmp/review.md)"
          # grep -c 는 0-match 시 exit 1 — errexit(set -e) 하에서 command substitution
          # 실패로 스텝 자체가 죽는다(fail-closed else 분기 도달 불가). || true 로 방지.
          verdict_count="$(grep -c '^VERDICT:' /tmp/review.md || true)"
          if [ "$last_line" = "VERDICT: FAIL" ]; then
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "reason=VERDICT: FAIL" >> "$GITHUB_OUTPUT"
          elif [ "$last_line" = "VERDICT: PASS" ] && [ "$verdict_count" = "1" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "reason=No blocking issues" >> "$GITHUB_OUTPUT"
          else
            # fail-closed: VERDICT 라인이 없으면 안전하게 차단
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "reason=No VERDICT line found — fail-closed" >> "$GITHUB_OUTPUT"
          fi

      - name: Post review comment (upsert)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GATE_RESULT: ${{ steps.gate.outputs.result }}
        run: |
          MARKER="<!-- aws-demo-platform-pr-review -->"
          if [ "$GATE_RESULT" = "fail" ] && [ "${chair_failed:-0}" = "1" ]; then
            # chair(Fable 5/Opus 5 둘 다) 가 timeout/연결 오류로 리뷰를 못 만든 경우 —
            # fail-closed 로 여전히 BLOCKED 하지만, 코드에 CRITICAL/MAJOR 가 있다는 뜻이
            # 아니므로 문구를 구분한다(synthesize.sh 의 chair-failed.flag → chair_failed).
            STATUS_BADGE="**Status: BLOCKED** — review generation failed (model timeout/error) — not a code issue, re-run the workflow"
          elif [ "$GATE_RESULT" = "fail" ]; then
            STATUS_BADGE="**Status: BLOCKED** — CRITICAL/MAJOR issues must be resolved before merge"
          else
            STATUS_BADGE="**Status: PASSED** — No blocking issues found"
          fi
          # 마지막 non-empty 줄의 VERDICT 라인만 코멘트에서 제거 (gate 신호용) —
          # 위 gate 스텝의 awk 정규화와 동일 기준: trailing 빈 줄이 있어도 정확히
          # 걸러내야 VERDICT 라인이 PR 코멘트에 남는 사고를 막는다.
          last_verdict_ln="$(awk '/^VERDICT:/{ln=NR} END{print ln+0}' /tmp/review.md)"
          if [ "$last_verdict_ln" -gt 0 ]; then
            sed "${last_verdict_ln}d" /tmp/review.md > /tmp/review-clean.md
          else
            cp /tmp/review.md /tmp/review-clean.md
          fi
          {
            echo "$MARKER"
            echo "## 🤖 AI Code Review (${chair_used:-Claude Fable 5} chair · lens×model matrix: Codex + Kiro x3 + Claude self-review, L2-L5)"
            echo ""
            echo "_Cells (model/lens): ${panel_responded:-solo}_"
            [ "${panel_truncated:-0}" = "1" ] && echo "_⚠️ diff truncated to first 3000 lines — review is partial._"
            echo ""
            echo "$STATUS_BADGE"
            echo ""
            cat /tmp/review-clean.md
            echo ""
            echo "---"
            echo "_Triggered by commit \`${{ github.event.pull_request.head.sha }}\` · workflow: \`.github/workflows/pr-review.yml\`_"
          } > /tmp/comment.md
          # 기존 marker 코멘트가 있으면 PATCH로 업서트, 없으면 새로
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- aws-demo-platform-pr-review -->")) | .id' 2>/dev/null | head -1)
          if [ -n "$EXISTING" ]; then
            gh api "repos/$REPO/issues/comments/$EXISTING" -X PATCH -f body="$(cat /tmp/comment.md)" 2>/dev/null || \
              gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          fi

      - name: Fail if CRITICAL or MAJOR
        if: steps.gate.outputs.result == 'fail'
        run: |
          echo "AI Review failed: ${{ steps.gate.outputs.reason }}"
          exit 1
